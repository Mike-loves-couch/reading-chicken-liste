<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Chicken</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-tema="fattoria">
  <main>
    <section id="schermata-caricamento" class="schermata">
      <p class="caricamento">Caricamento…</p>
    </section>

    <section id="schermata-menu" class="schermata" hidden>
      <div id="account" class="account" hidden>
        <a id="link-accedi" href="accedi/" hidden>Accedi</a>
        <span id="account-nome" hidden></span>
        <button type="button" id="pulsante-esci-account" class="pulsante secondario piccolo" hidden>Esci</button>
      </div>
      <h1><img id="mascotte" src="img/sprite/pollo.png" alt="" class="mascotte pixel"> Reading Chicken</h1>
      <div class="menu-griglia">
        <fieldset class="riquadro area-tipo">
          <legend>Cosa leggiamo?</legend>
          <label class="scelta"><input type="radio" name="tipo" autocomplete="off" value="sillabe"> Sillabe</label>
          <p class="errore-file" id="errore-sillabe" hidden></p>
          <label class="scelta"><input type="radio" name="tipo" autocomplete="off" value="parole"> Parole</label>
          <p class="errore-file" id="errore-parole" hidden></p>
        </fieldset>
        <fieldset class="riquadro area-lista">
          <legend>Lista</legend>
          <div id="elenco-liste" class="elenco-liste"><p class="suggerimento">Scegli prima cosa leggere.</p></div>
        </fieldset>
        <fieldset class="riquadro area-quantita">
          <legend>Quante?</legend>
          <div id="elenco-quantita"><p class="suggerimento">Scegli prima una lista.</p></div>
        </fieldset>
        <fieldset class="riquadro area-lettere">
          <legend>Lettere</legend>
          <label class="scelta"><input type="radio" name="maiuscolo" autocomplete="off" value="si"> MAIUSCOLO</label>
          <label class="scelta"><input type="radio" name="maiuscolo" autocomplete="off" value="no"> minuscolo</label>
        </fieldset>
        <fieldset class="riquadro area-mondo">
          <legend>Mondo</legend>
          <div class="mondi">
            <label class="scelta scelta-mondo"><input type="radio" name="tema" autocomplete="off" value="fattoria"><img src="img/sprite/mais.png" alt="" class="icona-mondo pixel">Fattoria</label>
            <label class="scelta scelta-mondo"><input type="radio" name="tema" autocomplete="off" value="dungeon"><img src="img/sprite/gemma-ametista.png" alt="" class="icona-mondo pixel">Dungeon</label>
            <label class="scelta scelta-mondo"><input type="radio" name="tema" autocomplete="off" value="spazio"><img src="img/sprite/stella.png" alt="" class="icona-mondo pixel">Spazio</label>
          </div>
        </fieldset>
      </div>
      <div class="azioni">
        <label id="chi-gioca" class="chi-gioca" hidden>Chi gioca <select id="scelta-bambino"></select></label>
        <button type="button" id="pulsante-gioca" class="pulsante grande primario" disabled>Gioca</button>
        <button type="button" id="pulsante-storico" class="pulsante secondario">Storico</button>
      </div>
    </section>

    <section id="schermata-gioco" class="schermata" hidden>
      <header class="barra">
        <span class="contatore"><img id="icona-contatore" src="img/sprite/mais.png" alt="" class="icona pixel"> <span id="contatore">0 / 0</span></span>
        <div class="comandi">
          <button type="button" id="pulsante-suoni" class="pulsante secondario piccolo solo-icona" aria-pressed="true" aria-label="Suoni" title="Suoni">
            <svg viewBox="0 0 13 12" aria-hidden="true">
              <rect x="1" y="4" width="2" height="4"/><rect x="3" y="3" width="1" height="6"/><rect x="4" y="2" width="1" height="8"/><rect x="5" y="1" width="1" height="10"/>
              <g class="onde"><rect x="7" y="4" width="1" height="4"/><rect x="8" y="1" width="1" height="1"/><rect x="9" y="2" width="1" height="8"/><rect x="8" y="10" width="1" height="1"/></g>
              <g class="muto"><rect x="7" y="3" width="1" height="1"/><rect x="8" y="4" width="1" height="1"/><rect x="9" y="5" width="2" height="2"/><rect x="11" y="7" width="1" height="1"/><rect x="12" y="8" width="1" height="1"/><rect x="12" y="3" width="1" height="1"/><rect x="11" y="4" width="1" height="1"/><rect x="8" y="7" width="1" height="1"/><rect x="7" y="8" width="1" height="1"/></g>
            </svg>
          </button>
          <button type="button" id="pulsante-esci" class="pulsante secondario piccolo">Esci</button>
        </div>
      </header>
      <div class="area-labirinto">
        <canvas id="canvas-labirinto"></canvas>
      </div>
      <div id="pannello-parola" class="sovrapposizione" hidden>
        <div class="scheda">
          <p id="parola-testo" class="parola-testo"></p>
          <div class="azioni">
            <button type="button" id="pulsante-corretta" class="pulsante grande verde" tabindex="-1" aria-keyshortcuts="C"><u>C</u>orretta</button>
            <button type="button" id="pulsante-riprova" class="pulsante grande arancione" tabindex="-1" aria-keyshortcuts="R"><u>R</u>iprova</button>
          </div>
        </div>
      </div>
      <div id="festa" class="festa" hidden><p>Molto bene!</p></div>
    </section>

    <section id="schermata-riepilogo" class="schermata" hidden>
      <h1>Com'è andata</h1>
      <div class="riquadro pagina">
        <p id="riepilogo-intestazione" class="intestazione"></p>
        <div id="riepilogo-tabella"></div>
        <p id="riepilogo-totali"></p>
        <p id="riepilogo-non-salvata" class="avviso" hidden>Questa partita non è stata salvata nello storico.</p>
        <p id="riepilogo-invio" hidden></p>
      </div>
      <div class="azioni">
        <button type="button" id="riepilogo-menu" class="pulsante grande primario">Torna al menu</button>
      </div>
    </section>

    <section id="schermata-storico" class="schermata" hidden>
      <h1 id="storico-titolo">Storico</h1>
      <div id="storico-elenco" class="riquadro pagina"></div>
      <div id="storico-dettaglio" class="riquadro pagina" hidden></div>
      <div class="azioni">
        <button type="button" id="storico-indietro" class="pulsante">Indietro</button>
        <button type="button" id="storico-cancella" class="pulsante secondario">Cancella storico</button>
      </div>
    </section>
  </main>

  <div id="pannello-errore" class="sovrapposizione" hidden>
    <div class="scheda">
      <p class="errore-titolo">Qualcosa è andato storto</p>
      <p id="errore-dettaglio" class="errore-dettaglio"></p>
      <button type="button" id="errore-menu" class="pulsante grande primario">Torna al menu</button>
    </div>
  </div>
</body>
</html>

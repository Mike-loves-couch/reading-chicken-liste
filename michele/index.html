<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Chicken · Logopedista</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pagine.css">
  <script type="module" src="michele.js"></script>
</head>
<body data-tema="fattoria">
  <main class="schermata">
    <h1><img src="../img/sprite/pollo.png" alt="" class="mascotte pixel"> Reading Chicken</h1>

    <p id="caricamento">Caricamento…</p>

    <section id="accesso" class="riquadro pagina" hidden>
      <p>Pagina del logopedista. Scrivi la tua email: ti mandiamo un link per entrare.</p>
      <form id="modulo-link" class="modulo-link">
        <label>Email <input name="email" type="email" required autocomplete="email"></label>
        <button type="submit" class="pulsante primario">Mandami il link</button>
      </form>
      <p id="messaggio-link" role="status"></p>
    </section>

    <section id="non-logopedista" class="riquadro pagina" hidden>
      <p>Questa pagina è per il logopedista. <a href="../">Vai al gioco</a></p>
    </section>

    <div id="area-logopedista" class="pagina colonna" hidden>
      <div class="barra-pagina">
        <strong id="chi-sei"></strong>
        <button type="button" id="pulsante-esci" class="pulsante secondario piccolo">Esci</button>
      </div>

      <form id="modulo-invito" class="riquadro modulo-invito">
        <h2>Invita una famiglia</h2>
        <label>Email del genitore <input name="email" type="email" required></label>
        <label>Nome della famiglia (facoltativo) <input name="nome" maxlength="80" placeholder="Famiglia Rossi"></label>
        <label>Chi gioca: nomi di fantasia, separati da virgola <input name="bambini" required placeholder="Pulcino, Gallo"></label>
        <button type="submit" class="pulsante primario">Invita</button>
      </form>

      <p id="messaggio" role="status"></p>

      <section class="colonna">
        <h2>Famiglie</h2>
        <div id="elenco-famiglie" class="colonna"></div>
      </section>
    </div>

    <p class="piede"><a href="../privacy.html">Privacy</a></p>
  </main>
</body>
</html>
